name: TEMP — Environment main branch-denial probe

on:
  push:
    branches:
      - feat/bb-05-option-engine

permissions: {}

jobs:
  must-be-rejected-before-runner:
    name: Comprobar que PR branch no puede acceder a Environment main
    if: github.ref != 'refs/heads/main'
    environment: main
    runs-on: ubuntu-latest
    steps:
      - name: Si llega a ejecutarse, falló la política de Environment
        run: |
          echo "::error::La rama de la PR ingresó al Environment main; revisar políticas"
          exit 1

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  bootstrap-scope:
    name: Validar alcance del bootstrap Auth
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bootstrap_allowed: ${{ steps.scope.outputs.bootstrap_allowed }}
    steps:
      - name: Permitir excepción sólo para PR #39 y archivos de infraestructura exactos
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          allowed=false
          if [[ "$PR_NUMBER" == "39" && "$HEAD_REF" == "codex/bb11-auth-bootstrap" ]]; then
            mapfile -t files < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
            if ((${#files[@]} > 0)); then
              allowed=true
              for file in "${files[@]}"; do
                case "$file" in
                  .github/workflows/admin-auth-reviewed.yml|.github/workflows/ci.yml|scripts/check-admin-auth-cloud.mjs) ;;
                  *) allowed=false; echo "::error::Archivo fuera del bootstrap permitido: $file" ;;
                esac
              done
            fi
          fi
          echo "bootstrap_allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [[ "$allowed" == true ]]; then
            echo "PR #39 contiene exclusivamente infraestructura bootstrap permitida."
          else
            echo "No se habilita ninguna excepción de gates para esta PR."
          fi

  status-provenance:
    name: Validar procedencia de statuses cloud
    needs: bootstrap-scope
    if: github.event_name == 'pull_request' && needs.bootstrap-scope.outputs.bootstrap_allowed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Validar HEAD, creator, run y conclusión de cada contexto
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          pr_sha="$(gh api "$api/pulls/$PR_NUMBER" --jq '.head.sha')"
          [[ "$pr_sha" == "$REVIEWED_SHA" ]] || { echo "::error::La PR cambió de SHA durante la validación"; exit 1; }

          validate_context() {
            local context="$1" expected_workflow="$2"
            export CONTEXT="$context"
            status="$(gh api "$api/statuses/$REVIEWED_SHA" --jq '[.[] | select(.context == env.CONTEXT)][0] // empty')"
            [[ -n "$status" ]] || { echo "::error::Falta status $context"; return 1; }
            local state creator target permission run_id run_sha run_path run_status run_conclusion
            state="$(jq -r '.state' <<< "$status")"
            creator="$(jq -r '.creator.login // empty' <<< "$status")"
            target="$(jq -r '.target_url // empty' <<< "$status")"
            permission="none"
            if [[ "$creator" != "github-actions[bot]" && -n "$creator" ]]; then
              permission="$(gh api "$api/collaborators/$creator/permission" --jq '.permission // "none"' 2>/dev/null || echo none)"
            fi
            [[ "$state" == "success" && -n "$creator" ]] || { echo "::error::Status $context no está en success o no tiene creator"; return 1; }
            run_prefix="https://github.com/$GITHUB_REPOSITORY/actions/runs/"
            [[ "$target" == "$run_prefix"* ]] || { echo "::error::target_url inválida para $context"; return 1; }
            run_id="${target#"$run_prefix"}"
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::target_url sin ID numérico para $context"; return 1; }
            run_json="$(gh api "$api/actions/runs/$run_id")"
            run_sha="$(jq -r '.head_sha // empty' <<< "$run_json")"
            run_path="$(jq -r '.path // empty' <<< "$run_json")"
            run_status="$(jq -r '.status // empty' <<< "$run_json")"
            run_conclusion="$(jq -r '.conclusion // empty' <<< "$run_json")"
            [[ "$run_sha" == "$REVIEWED_SHA" && "$run_status" == "completed" && "$run_conclusion" == "success" && "$run_path" == "$expected_workflow" ]] || { echo "::error::Run $run_id no corresponde al SHA/workflow/conclusión esperados para $context"; return 1; }
            if [[ "$creator" != "github-actions[bot]" && "$permission" != "write" && "$permission" != "maintain" && "$permission" != "admin" ]]; then
              echo "::error::Creator no autorizado para $context: $creator"; return 1
            fi
            echo "Status $context verificado: run $run_id, SHA exacto, workflow $run_path, creator autorizado."
          }

          validate_context cloud/pgTAP-reviewed .github/workflows/cloud-db-reviewed.yml
          validate_context cloud/admin-auth-reviewed .github/workflows/admin-auth-reviewed.yml
          validate_context cloud/admin-auth-product-reviewed .github/workflows/admin-auth-product-reviewed.yml

  cloud-reviewed:
    name: pgTAP cloud revisado (SHA exacto)
    needs: [bootstrap-scope, status-provenance]
    if: always() && github.event_name == 'pull_request' && needs.bootstrap-scope.outputs.bootstrap_allowed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.status-provenance.result }}" = success

  admin-auth-reviewed:
    name: Auth cloud revisado (SHA exacto)
    needs: [bootstrap-scope, status-provenance]
    if: always() && github.event_name == 'pull_request' && needs.bootstrap-scope.outputs.bootstrap_allowed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.status-provenance.result }}" = success

  admin-auth-product-reviewed:
    name: Auth producto revisado (SHA exacto)
    needs: [bootstrap-scope, status-provenance]
    if: always() && github.event_name == 'pull_request' && needs.bootstrap-scope.outputs.bootstrap_allowed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.status-provenance.result }}" = success

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

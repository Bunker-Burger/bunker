name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verified_sha:
        description: "SHA del commit revisado y autorizado para pruebas cloud (opcional)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: supabase-cloud-development
      cancel-in-progress: false
    env:
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      GITHUB_REF: ${{ github.event.pull_request.head.ref || github.ref }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      VERIFIED_SHA: ${{ inputs.verified_sha || vars.AUTHORIZED_DEV_DB_SHA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validar autorización de confianza y URL de base de datos
        run: node scripts/validate-db-url.mjs
      - name: Ejecutar pgTAP en desarrollo
        run: npx supabase test db --db-url "$SUPABASE_DEV_DB_URL"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

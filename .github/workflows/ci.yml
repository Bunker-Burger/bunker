name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  bootstrap-scope:
    name: Validar alcance del bootstrap Auth
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bootstrap_allowed: ${{ steps.scope.outputs.bootstrap_allowed }}
    steps:
      - name: Permitir excepción sólo para PR #39 y archivos de infraestructura exactos
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          allowed=false
          if [[ "$PR_NUMBER" == "39" && "$HEAD_REF" == "codex/bb11-auth-bootstrap" ]]; then
            mapfile -t files < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
            if ((${#files[@]} > 0)); then
              allowed=true
              for file in "${files[@]}"; do
                case "$file" in
                  .github/workflows/admin-auth-reviewed.yml|.github/workflows/ci.yml|scripts/check-admin-auth-cloud.mjs) ;;
                  *) allowed=false; echo "::error::Archivo fuera del bootstrap permitido: $file" ;;
                esac
              done
            fi
          fi
          echo "bootstrap_allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [[ "$allowed" == true ]]; then
            echo "PR #39 contiene exclusivamente infraestructura bootstrap permitida."
          else
            echo "No se habilita ninguna excepción de gates para esta PR."
          fi

  cloud-reviewed:
    name: pgTAP cloud revisado (SHA exacto)
    needs: bootstrap-scope
    if: github.event_name == 'pull_request' && needs.bootstrap-scope.outputs.bootstrap_allowed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Exigir ejecución cloud autorizada desde el workflow confiable de main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_SHA/status" --jq '[.statuses[] | select(.context == "cloud/pgTAP-reviewed" and .sha == env.REVIEWED_SHA)][0] // empty')"
          [[ -n "$status" ]] || { echo "::error::Falta pgTAP cloud del SHA exacto"; exit 1; }
          state="$(jq -r '.state' <<< "$status")"
          creator="$(jq -r '.creator.login // empty' <<< "$status")"
          target="$(jq -r '.target_url // empty' <<< "$status")"
          permission="none"
          if [[ "$creator" != "github-actions[bot]" && -n "$creator" ]]; then permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$creator/permission" --jq '.permission // "none"' 2>/dev/null || echo none)"; fi
          if [[ "$state" != "success" || -z "$creator" || -z "$target" || "$target" != "https://github.com/$GITHUB_REPOSITORY/actions/runs/"* || ("$creator" != "github-actions[bot]" && "$permission" != "write" && "$permission" != "maintain" && "$permission" != "admin") ]]; then
            echo "::error::pgTAP status inválido: exige success, SHA exacto, actor autorizado y URL de run GitHub inmutable"
            exit 1
          fi
          echo "pgTAP cloud del SHA exacto y procedencia autorizada verificados; este job no usa secretos."

  admin-auth-reviewed:
    name: Auth cloud revisado (SHA exacto)
    needs: bootstrap-scope
    if: github.event_name == 'pull_request' && needs.bootstrap-scope.outputs.bootstrap_allowed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Exigir harness Auth confiable ejecutado desde main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_SHA/status" --jq '[.statuses[] | select(.context == "cloud/admin-auth-reviewed" and .sha == env.REVIEWED_SHA)][0] // empty')"
          [[ -n "$status" ]] || { echo "::error::Falta Auth cloud del SHA exacto"; exit 1; }
          state="$(jq -r '.state' <<< "$status")"
          creator="$(jq -r '.creator.login // empty' <<< "$status")"
          target="$(jq -r '.target_url // empty' <<< "$status")"
          permission="none"
          if [[ "$creator" != "github-actions[bot]" && -n "$creator" ]]; then permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$creator/permission" --jq '.permission // "none"' 2>/dev/null || echo none)"; fi
          if [[ "$state" != "success" || -z "$creator" || -z "$target" || "$target" != "https://github.com/$GITHUB_REPOSITORY/actions/runs/"* || ("$creator" != "github-actions[bot]" && "$permission" != "write" && "$permission" != "maintain" && "$permission" != "admin") ]]; then
            echo "::error::Auth cloud status inválido: exige success, SHA exacto, actor autorizado y URL de run GitHub inmutable"
            exit 1
          fi
          echo "Auth cloud del SHA exacto y procedencia autorizada verificados; este job no usa secretos."

  admin-auth-product-reviewed:
    name: Auth producto revisado (SHA exacto)
    needs: bootstrap-scope
    if: github.event_name == 'pull_request' && needs.bootstrap-scope.outputs.bootstrap_allowed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Exigir attestation externa del código Auth del SHA exacto
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEWED_SHA/status" --jq '[.statuses[] | select(.context == "cloud/admin-auth-product-reviewed" and .sha == env.REVIEWED_SHA)][0] // empty')"
          [[ -n "$status" ]] || { echo "::error::Falta attestation Auth producto del SHA exacto"; exit 1; }
          state="$(jq -r '.state' <<< "$status")"
          creator="$(jq -r '.creator.login // empty' <<< "$status")"
          target="$(jq -r '.target_url // empty' <<< "$status")"
          permission="none"
          if [[ "$creator" != "github-actions[bot]" && -n "$creator" ]]; then permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$creator/permission" --jq '.permission // "none"' 2>/dev/null || echo none)"; fi
          if [[ "$state" != "success" || -z "$creator" || -z "$target" || "$target" != "https://github.com/$GITHUB_REPOSITORY/actions/runs/"* || ("$creator" != "github-actions[bot]" && "$permission" != "write" && "$permission" != "maintain" && "$permission" != "admin") ]]; then
            echo "::error::Attestation Auth producto inválida: exige success, SHA exacto, actor autorizado y URL de run GitHub inmutable"
            exit 1
          fi
          echo "Attestation Auth producto del SHA exacto y procedencia autorizada verificadas; este job no usa secretos."

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

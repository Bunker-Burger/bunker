name: Migraciones Supabase Cloud

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ejecutar en modo dry-run (verificación sin aplicar cambios). Desmarcar para aplicar."
        type: boolean
        required: false
        default: true
      confirm_project:
        description: "Para apply (dry_run=false), ingrese exactamente el ID del proyecto ('zokkgocmcaqcujltfkjf')."
        type: string
        required: false
        default: ""
      verified_sha:
        description: "SHA del commit revisado y autorizado para aplicar migraciones (opcional si la rama es main)."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: supabase-cloud-development
  cancel-in-progress: false

jobs:
  migrate:
    name: Aplicar migraciones
    runs-on: ubuntu-latest
    environment: development
    env:
      SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_CONFIRM_PROJECT: ${{ inputs.confirm_project }}
      INPUT_BRANCH: ${{ github.ref }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      VERIFIED_SHA: ${{ inputs.verified_sha || vars.AUTHORIZED_DEV_DB_SHA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Validar identidad del proyecto y parámetros de migración
        run: node scripts/validate-db-url.mjs --migration

      - name: Dry-run de migraciones
        if: inputs.dry_run == true
        run: npx supabase db push --db-url "$SUPABASE_DEV_DB_URL" --dry-run

      - name: Aplicar migraciones a desarrollo
        if: inputs.dry_run != true && inputs.confirm_project == 'zokkgocmcaqcujltfkjf'
        run: npx supabase db push --db-url "$SUPABASE_DEV_DB_URL"

name: Copy Secret

on:
  workflow_dispatch:
    inputs:
      pat:
        description: "Admin Token"
        required: true

jobs:
  copy:
    runs-on: ubuntu-latest
    environment: main
    env:
      DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
      GH_TOKEN: ${{ inputs.pat }}
    steps:
      - name: Set secret in development environment
        run: |
          echo "$DB_URL" | gh secret set SUPABASE_DEV_DB_URL --env development --repo Bunker-Burger/bunker

name: TEMP — Repository secret scope negative probe

on:
  push:
    branches:
      - feat/bb-05-option-engine

permissions: {}

jobs:
  repository-secret-absence:
    runs-on: ubuntu-latest
    # Deliberately NO environment: scope must never expose DB secret.
    env:
      SECRET_SCOPE_PROBE: ${{ secrets.SUPABASE_DEV_DB_URL }}
    steps:
      - name: Confirmar ausencia sin imprimir credenciales
        shell: bash
        run: |
          if [[ -n "$SECRET_SCOPE_PROBE" ]]; then
            echo "::error::La credencial todavía es accesible como Repository/Organization secret desde la rama PR"
            exit 1
          fi
          echo "OK: este job de PR sin Environment no recibe SUPABASE_DEV_DB_URL"
